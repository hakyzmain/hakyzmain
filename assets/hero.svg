<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900">
  <defs>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="30%" stop-color="#3a3a3a"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#050505"/>
      <animate attributeName="x1" values="-520;1920" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2440" dur="3.4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="35%" stop-color="#6a6a6a"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#6a6a6a"/>
      <stop offset="100%" stop-color="#000000"/>
      <animate attributeName="x1" values="1920;-600" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="2520;0" dur="4.2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="900" fill="#000000"/>

  <text x="960" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" letter-spacing="3" fill="url(#shine)">made with &lt;3 for our player</text>
  <text x="960" y="520" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" letter-spacing="2" fill="url(#shine2)">&amp; Trust us with your game.</text>

  <text x="960" y="680" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="14" fill="#4a4a4a">HZBTEAM</text>
</svg>

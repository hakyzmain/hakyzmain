<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="45%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="200" y2="900">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0,0;2300,0;0,0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="t1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1920" y2="0">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="40%" stop-color="#0d0d0d"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
      <animate attributeName="x1" values="-900;1920" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2820" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="t2" gradientUnits="userSpaceOnUse" x1="1920" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="42%" stop-color="#101010"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#101010"/>
      <animate attributeName="x1" values="2820;-900" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1920;0" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="soft">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="900" fill="#000000"/>
  <rect width="1920" height="900" fill="url(#bg)"/>
  <rect width="1920" height="900" fill="url(#sweep)"/>

  <text x="960" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" letter-spacing="3" fill="url(#t1)" filter="url(#soft)">made with &lt;3 for our player</text>
  <text x="960" y="520" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" letter-spacing="2" fill="url(#t2)" filter="url(#soft)">&amp; Trust us with your game.</text>

  <text x="960" y="680" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="14" fill="#4a4a4a">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/>
    HZBTEAM
  </text>
</svg>

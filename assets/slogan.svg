<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="480" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="25%" stop-color="#333333"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#000000"/>
      <animate attributeName="x1" values="-480;1200" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1680" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="40%" stop-color="#b0b0b0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#000000"/>
      <animate attributeName="x1" values="1200;-560" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1760;0" dur="4.6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="#000000"/>
  <rect x="220" y="48" width="760" height="1" fill="#1c1c1c"/>
  <text x="600" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" letter-spacing="1.5" fill="url(#shine)">made with &lt;3 for our player</text>
  <text x="600" y="185" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" letter-spacing="1.2" fill="url(#shine2)">&amp; Trust us with your game.</text>
  <rect x="220" y="230" width="760" height="1" fill="#1c1c1c"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900">
  <defs>
    <linearGradient id="base1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="50%" stop-color="#eaeaea"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
    <linearGradient id="base2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bdbdbd"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#bdbdbd"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0">
      <stop offset="0%" stop-color="#b8b8b8"/>
      <stop offset="35%" stop-color="#ececec"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ececec"/>
      <stop offset="100%" stop-color="#b8b8b8"/>
      <animate attributeName="x1" values="-420;1920" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2340" dur="2.8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="480" y2="0">
      <stop offset="0%" stop-color="#aeaeae"/>
      <stop offset="40%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#aeaeae"/>
      <animate attributeName="x1" values="1920;-480" dur="3.3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="2400;0" dur="3.3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="900" fill="#000000"/>

  <text x="960" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" letter-spacing="3" fill="url(#wave)">made with &lt;3 for our player</text>
  <text x="960" y="520" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" letter-spacing="2" fill="url(#wave2)">&amp; Trust us with your game.</text>

  <text x="960" y="680" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="14" fill="#9a9a9a">HZBTEAM</text>
</svg>
